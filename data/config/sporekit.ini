; SporeKit configuration (copied to SporebinEP1/mods on first deploy)
[sporekit]
; 0=debug 1=info 2=warn 3=error
log_level=1
; devkit console on 127.0.0.1 (instance N uses port+N-1)
console_port=47800

[mods]
; comma separated list, or * for every mods/*.dll
load=*

; keep running and rendering when the window is not focused
; (default: on only for test runs started with -sporekit-profile / -sporekit-instance)
;background_mode=0
